name: checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned MoonBit toolchain
        env:
          MOONBIT_INSTALL_VERSION: '0.10.14+7d59c7ec9'
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh -o "$RUNNER_TEMP/moonbit-install.sh"
          bash "$RUNNER_TEMP/moonbit-install.sh"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: python -m pip install -r scripts/requirements-interop.txt
      - name: Verify build tests examples size and interoperability
        run: python scripts/validate.py --interop
      - name: Check public interface
        run: |
          moon info
          moon fmt --check
          git diff --exit-code -- '*.mbti'
